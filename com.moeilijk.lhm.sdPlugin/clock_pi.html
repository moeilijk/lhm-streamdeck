<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Clock</title><link rel="stylesheet" href="css/sdpi.css"></head>
<body><div class="sdpi-wrapper">
<div class="sdpi-item"><div class="sdpi-item-label">Language</div><select id="language" class="sdpi-item-value"><option value="en">English</option><option value="ru">Russian</option></select></div>
<div class="sdpi-item"><div class="sdpi-item-label">Time format</div><select id="twelveHour" class="sdpi-item-value"><option value="false">24 hour</option><option value="true">12 hour (AM/PM)</option></select></div>
<div class="sdpi-item"><div class="sdpi-item-label">Colon</div><select id="staticColon" class="sdpi-item-value"><option value="false">Slow fade</option><option value="true">Static</option></select></div>
<p>Uses the computer's local time and works without a sensor connection.</p>
</div><script src="clock_pi.js"></script></body></html>
